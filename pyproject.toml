[project]
name = "ten-drops"
version = "1.0.3"
description = "A ten drops game written in pygame-ce."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chyok", email = "chyok@hotmail.com" }]
maintainers = [{ name = "chyok", email = "chyok@hotmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["pygame-ce>=2.5.8,<3"]

[project.urls]
Homepage = "https://github.com/chyok/ten-drops"
Repository = "https://github.com/chyok/ten-drops"

[project.scripts]
ten-drops = "ten_drops.cli:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
