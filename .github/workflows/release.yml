# Push a tag like v1.0.4 (matching the version in pyproject.toml) to
# build the Windows binary, publish to PyPI and create the GitHub release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject version $version"
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build exe
        run: >-
          uv run --locked --python 3.11 --with pyinstaller==6.11.1
          pyinstaller main.py --onefile --windowed
          --name "ten-drops-$env:TAG"
          --icon ten_drops/asset/img/game.ico
          --add-data "ten_drops/asset:ten_drops/asset"
      - name: Zip exe
        run: >-
          Compress-Archive
          -Path "dist/ten-drops-$env:TAG.exe"
          -DestinationPath "ten-drops-$env:TAG-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ten-drops-${{ env.TAG }}-windows.zip

  dist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: [windows, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" "ten-drops-$TAG-windows.zip"
          --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
